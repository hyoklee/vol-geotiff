name: Comprehensive Testing

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run comprehensive tests weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  comprehensive-matrix-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hdf5_version: ['develop']
        compiler: [gcc, clang, msvc]
        build_type: [Release, Debug]
        exclude:
          # Reduce matrix size for macOS (clang is default)
          - os: macos-latest
            compiler: gcc
          - os: macos-latest
            compiler: msvc
          # Windows only uses MSVC
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang
          # Linux doesn't use MSVC
          - os: ubuntu-latest
            compiler: msvc
          # Skip Windows Debug: vcpkg libs are Release-only, causing DLL mismatch
          - os: windows-latest
            build_type: Debug

    steps:
    - uses: actions/checkout@v6

    - name: Set up environment
      run: |
        echo "OS: ${{ matrix.os }}"
        echo "HDF5: ${{ matrix.hdf5_version }}"
        echo "Compiler: ${{ matrix.compiler }}"
        echo "Build type: ${{ matrix.build_type }}"

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libtiff5-dev \
          libgeotiff-dev \
          zlib1g-dev \
          libcurl4-openssl-dev \
          libjpeg-dev \
          libpng-dev \
          valgrind

        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install cmake pkg-config libtiff libgeotiff

    - name: Install Windows dependencies via vcpkg
      if: runner.os == 'Windows'
      run: |
        # Use built-in vcpkg from GitHub Actions
        $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
        Write-Host "Using vcpkg at: $env:VCPKG_ROOT"

        # Install dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install tiff[jpeg,lzma,zip,zstd]:x64-windows
        & "$env:VCPKG_ROOT\vcpkg.exe" install libgeotiff:x64-windows

        # Debug: Check what was installed
        Write-Host "`nChecking installed files..."
        Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\include" -Recurse -Filter "*geotiff*"

        # Check if headers are in geotiff subdirectory
        $includeDir = "$env:VCPKG_ROOT\installed\x64-windows\include"
        if (-Not (Test-Path "$includeDir\geotiff\geotiffio.h")) {
            Write-Host "`nHeaders not in geotiff/ subdirectory, creating compatibility layer"
            New-Item -ItemType Directory -Force -Path "$includeDir\geotiff"

            # Copy all geotiff headers to subdirectory
            $headers = @("geotiffio.h", "geo_normalize.h", "geotiff.h", "xtiffio.h", "geovalues.h",
                         "geokeys.h", "geonames.h", "geo_tiffp.h", "cpl_serv.h", "geo_config.h",
                         "geo_simpletags.h", "geo_keyp.h")

            foreach ($header in $headers) {
                if (Test-Path "$includeDir\$header") {
                    Copy-Item "$includeDir\$header" "$includeDir\geotiff\$header"
                    Write-Host "Copied $header to geotiff/"
                }
            }
        } else {
            Write-Host "`nHeaders already in geotiff/ subdirectory"
        }

        # Set CMAKE_PREFIX_PATH for later steps
        echo "CMAKE_PREFIX_PATH=$env:VCPKG_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Cache HDF5
      id: cache-hdf5
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}
        key: hdf5-${{ matrix.hdf5_version }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.run_number }}-${{ hashFiles('.github/workflows/comprehensive-test.yml') }}

    - name: Build HDF5 (Unix)
      if: steps.cache-hdf5.outputs.cache-hit != 'true' && runner.os != 'Windows'
      run: |
        cd ${{ github.workspace }}
        git clone --depth 1 --branch develop https://github.com/HDFGroup/hdf5.git hdf5-${{ matrix.hdf5_version }}
        cd hdf5-${{ matrix.hdf5_version }}
        mkdir build && cd build

        if [ "${{ matrix.compiler }}" = "clang" ]; then
          export CC=clang
          export CXX=clang++
        fi

        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }} \
          -DHDF5_ENABLE_PARALLEL=OFF \
          -DHDF5_BUILD_TOOLS=ON \
          -DHDF5_BUILD_EXAMPLES=OFF \
          -DHDF5_BUILD_TESTS=OFF \
          -DBUILD_SHARED_LIBS=ON \
          -DHDF5_ENABLE_Z_LIB_SUPPORT=ON

        if [ "${{ runner.os }}" = "macOS" ]; then
          make -j$(sysctl -n hw.ncpu)
        else
          make -j$(nproc)
        fi
        make install

    - name: Build HDF5 (Windows)
      if: steps.cache-hdf5.outputs.cache-hit != 'true' && runner.os == 'Windows'
      run: |
        cd ${{ github.workspace }}
        git clone --depth 1 --branch develop https://github.com/HDFGroup/hdf5.git hdf5-${{ matrix.hdf5_version }}
        cd hdf5-${{ matrix.hdf5_version }}
        mkdir build
        cd build

        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}" `
          -DHDF5_ENABLE_PARALLEL=OFF `
          -DHDF5_BUILD_TOOLS=ON `
          -DHDF5_BUILD_EXAMPLES=OFF `
          -DHDF5_BUILD_TESTS=OFF `
          -DBUILD_SHARED_LIBS=ON `
          -DHDF5_ENABLE_Z_LIB_SUPPORT=ON

        cmake --build . --config ${{ matrix.build_type }} --parallel
        cmake --install . --config ${{ matrix.build_type }}
      shell: pwsh

    - name: Verify test GeoTIFF files exist (Unix)
      if: runner.os != 'Windows'
      run: |
        echo "Using existing valid GeoTIFF test files from repository:"
        ls -lh test/*.tif | head -10

    - name: Verify test GeoTIFF files exist (Windows)
      if: runner.os == 'Windows'
      run: |
        Write-Host "Using existing valid GeoTIFF test files from repository:"
        Get-ChildItem test\*.tif | Select-Object -First 10 | Format-Table Name, Length
      shell: pwsh

    - name: Check libgeotiff header locations (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "=== Checking where geotiff headers are installed ==="
        find /opt/homebrew -name "geotiffio.h" 2>/dev/null || true
        find /opt/homebrew -name "geo_normalize.h" 2>/dev/null || true
        echo "=== Listing /opt/homebrew/include ==="
        ls -la /opt/homebrew/include/ | grep -i geotiff || true
        echo "=== Checking for geotiff subdirectory ==="
        ls -la /opt/homebrew/include/geotiff/ 2>/dev/null || echo "No geotiff subdirectory"

    - name: Configure and build (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir build && cd build

        if [ "${{ matrix.compiler }}" = "clang" ]; then
          export CC=clang
          export CXX=clang++
        fi

        # Set CMAKE_PREFIX_PATH to include Homebrew on macOS
        if [ "${{ runner.os }}" = "macOS" ]; then
          BREW_PREFIX=$(brew --prefix)
          CMAKE_PREFIX_PATH="${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }};${BREW_PREFIX}"
        else
          CMAKE_PREFIX_PATH="${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}"
        fi

        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DHDF5_DIR=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/share/cmake \
          -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
          -DCMAKE_C_FLAGS="-Wall -Wextra"

        if [ "${{ runner.os }}" = "macOS" ]; then
          make -j$(sysctl -n hw.ncpu)
        else
          make -j$(nproc)
        fi

    - name: Configure and build (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build

        $hdf5Dir = "${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/cmake"
        $prefixPath = "$env:CMAKE_PREFIX_PATH;${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}"

        Write-Host "HDF5_DIR: $hdf5Dir"
        Write-Host "CMAKE_PREFIX_PATH: $prefixPath"
        Write-Host "VCPKG_INSTALLATION_ROOT: $env:VCPKG_INSTALLATION_ROOT"

        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_PREFIX_PATH="$prefixPath" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows

        Write-Host "`nCMake configuration completed. Checking what was found..."
        Get-Content CMakeCache.txt | Select-String -Pattern "GEOTIFF|TIFF|HDF5"

        cmake --build . --config ${{ matrix.build_type }} --parallel
      shell: pwsh

    - name: Run comprehensive tests (Unix)
      if: runner.os != 'Windows'
      run: |
        cd build
        export HDF5_PLUGIN_PATH=$PWD/src
        if [ "${{ runner.os }}" = "Linux" ]; then
          export LD_LIBRARY_PATH=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/lib:$LD_LIBRARY_PATH
        else
          export DYLD_LIBRARY_PATH=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/lib:$DYLD_LIBRARY_PATH
        fi
        export PATH=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/bin:$PATH

        # Run basic tests
        make test

        # Test with a few different GeoTIFF files to verify comprehensive support
        for tiff_file in ../test/byte.tif ../test/uint16.tif ../test/int32.tif; do
          if [ -f "$tiff_file" ]; then
            echo "Testing with $tiff_file"
            ./test/test_runner real_file_test "$tiff_file" || echo "Test failed for $tiff_file"
          fi
        done

    - name: Run comprehensive tests (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 30
      run: |
        cd build

        # Debug: Check HDF5 installation structure
        Write-Host "Checking HDF5 installation..."
        $hdf5Root = "${{ github.workspace }}\hdf5-${{ matrix.hdf5_version }}"
        Write-Host "HDF5 root: $hdf5Root"
        if (Test-Path $hdf5Root) {
          Write-Host "`nHDF5 directory structure:"
          Get-ChildItem $hdf5Root | Format-Table Name
          Write-Host "`nChecking for bin directories:"
          Get-ChildItem "$hdf5Root\bin" -ErrorAction SilentlyContinue | Format-Table Name
          if (Test-Path "$hdf5Root\bin") {
            Write-Host "`nDLLs in bin:"
            Get-ChildItem "$hdf5Root\bin\*.dll" -Recurse -ErrorAction SilentlyContinue | Format-Table FullName
          }
        }

        # Copy DLLs to test directory for reliable access
        Write-Host "`nCopying required DLLs to test directory..."
        $testDir = ".\test\${{ matrix.build_type }}"

        # Try multiple possible HDF5 bin locations
        $hdf5BinDirs = @(
          "${{ github.workspace }}\hdf5-${{ matrix.hdf5_version }}\bin\${{ matrix.build_type }}",
          "${{ github.workspace }}\hdf5-${{ matrix.hdf5_version }}\bin"
        )

        $vcpkgBinDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
        $volBinDir = ".\src\${{ matrix.build_type }}"

        # Copy HDF5 DLLs from first location that exists
        $hdf5Found = $false
        foreach ($hdf5BinDir in $hdf5BinDirs) {
          if (Test-Path $hdf5BinDir) {
            $dlls = Get-ChildItem "$hdf5BinDir\*.dll" -ErrorAction SilentlyContinue
            if ($dlls) {
              Copy-Item "$hdf5BinDir\*.dll" $testDir -Force -ErrorAction SilentlyContinue
              Write-Host "Copied HDF5 DLLs from $hdf5BinDir"
              Write-Host "  Found $($dlls.Count) DLL(s): $($dlls.Name -join ', ')"
              $hdf5Found = $true
              break
            }
          }
        }

        if (-not $hdf5Found) {
          Write-Host "WARNING: No HDF5 DLLs found in any expected location!"
        }

        # Copy vcpkg DLLs (tiff, geotiff, zlib, zstd, etc.)
        if (Test-Path $vcpkgBinDir) {
          Copy-Item "$vcpkgBinDir\*.dll" $testDir -Force -ErrorAction SilentlyContinue
          Write-Host "Copied vcpkg DLLs from $vcpkgBinDir"
        }

        # Copy VOL connector DLL
        if (Test-Path $volBinDir) {
          Copy-Item "$volBinDir\*.dll" $testDir -Force -ErrorAction SilentlyContinue
          Write-Host "Copied VOL connector DLL from $volBinDir"
        }

        # List DLLs in test directory
        Write-Host "`nAll DLLs in test directory:"
        Get-ChildItem $testDir -Filter "*.dll" | Format-Table Name, Length

        # Set environment variables
        $env:HDF5_PLUGIN_PATH = "$PWD\src\${{ matrix.build_type }};$PWD\src"
        $env:HDF5_VOL_CONNECTOR = ""

        Write-Host "`nEnvironment variables:"
        Write-Host "HDF5_PLUGIN_PATH: $env:HDF5_PLUGIN_PATH"

        # Run basic tests with timeout
        Write-Host "`nRunning tests with 60 second timeout per test..."
        ctest -C ${{ matrix.build_type }} --output-on-failure --timeout 60

        # Test with a few different GeoTIFF files to verify comprehensive support
        $testFiles = @("..\test\byte.tif", "..\test\uint16.tif", "..\test\int32.tif", "..\test\byte_zstd.tif")
        foreach ($tiffFile in $testFiles) {
          if (Test-Path $tiffFile) {
            Write-Host "Testing with $tiffFile"
            & ".\test\${{ matrix.build_type }}\test_runner.exe" real_file_test $tiffFile
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Test failed for $tiffFile"
            }
          }
        }
      shell: pwsh

    - name: Memory leak test (Linux only)
      if: runner.os == 'Linux' && matrix.build_type == 'Debug'
      run: |
        cd build
        export HDF5_PLUGIN_PATH=$PWD/src
        export LD_LIBRARY_PATH=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/lib:$LD_LIBRARY_PATH

        # Run valgrind on basic test
        valgrind --leak-check=full --error-exitcode=1 ./test/test_runner test_getters

        # Test one GeoTIFF file with valgrind
        if [ -f ../test/byte.tif ]; then
          valgrind --leak-check=full --error-exitcode=1 ./test/test_runner real_file_test ../test/byte.tif
        fi

    - name: Performance test (Unix)
      if: runner.os != 'Windows'
      run: |
        cd build
        export HDF5_PLUGIN_PATH=$PWD/src
        if [ "${{ runner.os }}" = "Linux" ]; then
          export LD_LIBRARY_PATH=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/lib:$LD_LIBRARY_PATH
        else
          export DYLD_LIBRARY_PATH=${{ github.workspace }}/hdf5-${{ matrix.hdf5_version }}/lib:$DYLD_LIBRARY_PATH
        fi

        # Simple performance timing
        if [ -f ../test/uint16.tif ]; then
          echo "Performance test:"
          time ./test/test_runner real_file_test ../test/uint16.tif
        fi

    - name: Performance test (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build

        # Set environment variables (DLLs already copied in test step)
        $env:HDF5_PLUGIN_PATH = "$PWD\src\${{ matrix.build_type }};$PWD\src"
        $env:HDF5_VOL_CONNECTOR = ""

        # Simple performance timing
        if (Test-Path "..\test\uint16.tif") {
          Write-Host "Performance test:"
          Measure-Command {
            & ".\test\${{ matrix.build_type }}\test_runner.exe" real_file_test "..\test\uint16.tif"
          } | Select-Object TotalSeconds
        }
      shell: pwsh

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: test-failure-${{ matrix.os }}-${{ matrix.hdf5_version }}-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: |
          build/Testing/Temporary/
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log

  test-summary:
    runs-on: ubuntu-latest
    needs: comprehensive-matrix-test
    if: always()

    steps:
    - name: Test Summary
      run: |
        echo "Comprehensive testing completed!"
        echo "Check individual job results for details."

        if [ "${{ needs.comprehensive-matrix-test.result }}" != "success" ]; then
          echo "Some tests failed. Please review the job outputs."
          exit 1
        fi